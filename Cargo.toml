[package]
name = "keychronctl"
version = "0.1.0"
edition = "2021"
description = "Configure Keychron keyboards, mice, and receivers over USB HID"
license = "MIT"

[dependencies]
hidapi = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
libc = "0.2"

[profile.release]
strip = true
lto = true
