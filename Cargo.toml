[package]
name = "keychronctl"
version = "0.1.0"
edition = "2021"
description = "Configure Keychron keyboards, mice, and receivers over USB HID"
license = "MIT"

[dependencies]
hidapi = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
